<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reunion 123</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- TOP EXCEL TITLE BAR -->
  <header class="excel-titlebar no-print">
    <div class="titlebar-left">
      <nav class="wb-switch" aria-label="Apartados">
        <a href="/?wb=reunion" data-wb="reunion">Reunion</a>
        <a href="/?wb=cosecha" data-wb="cosecha">Plan de cosecha</a>
      </nav>
      <div class="quick-access-bar">
        <button class="qa-btn" id="btnUndo" title="Undo (Ctrl+Z)" disabled>↶</button>
        <button class="qa-btn" id="btnRedo" title="Redo (Ctrl+Y)" disabled>↷</button>
      </div>
      <!-- visual only for now: no action yet -->
      <button class="top-util-btn" id="btnActualizarData" type="button">Actualizar Data</button>
      <button class="top-util-btn" id="btnHomologaciones" type="button" hidden>Homologaciones</button>
    </div>

    <div class="titlebar-right">
      <div class="hide-menu-wrap">
        <button class="top-util-btn" id="btnHideMenu" title="Ocultar flores en 0 / herramientas">Ocultar ▾</button>
        <div class="hide-menu" id="hideMenu" hidden>
          <button class="hide-menu-item" id="btnZeroRows" style="display:none" title="Ocultar las flores que tienen toda la fila en 0"><span class="chk"></span><span class="lbl">Ocultar flores en 0</span></button>
          <button class="hide-menu-item" id="btnToggleRibbon" title="Ocultar / mostrar la cinta de herramientas (Ctrl+F1)"><span class="chk"></span><span class="lbl">Ocultar herramientas</span><span class="key">Ctrl+F1</span></button>
        </div>
      </div>
      <button class="top-util-btn" id="btnExportCsv" title="Download active sheet as Excel-compatible CSV">⬇ Export CSV</button>
    </div>
  </header>

  <!-- EXCEL FORMULA BAR -->
  <section class="excel-formulabar no-print">
    <div class="name-box-wrapper">
      <input type="text" id="cellNameBox" class="cell-name-box" value="A1" title="Cell or range reference (e.g. A1 or A1:D10)" />
    </div>
    <div class="formula-fx-badge" title="Excel Formula Bar">fx</div>
    <div class="formula-input-wrapper">
      <input type="text" id="formulaInput" class="formula-input" placeholder="Select a cell or type a value / formula (=SUM, =IF, =VLOOKUP, =INDEX...)" autocomplete="off" />
      <span id="cellMetaBadge" class="cell-meta-badge" style="display:none;"></span>
    </div>
  </section>

  <!-- EXCEL FORMAT TOOLBAR (Ribbon-style "Inicio") -->
  <section class="excel-format-toolbar no-print" id="formatToolbar">

    <!-- PORTAPAPELES -->
    <div class="fmt-group-wrap">
      <div class="fmt-group">
        <button class="fmt-icon-btn" id="btnPaste" title="Pegar (Ctrl+V)">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="3" y="2.5" width="10" height="11.5" rx="1"/><rect x="5.5" y="1" width="5" height="2.4" rx="0.6" fill="currentColor" stroke="none"/><line x1="5" y1="7" x2="11" y2="7"/><line x1="5" y1="9.5" x2="11" y2="9.5"/><line x1="5" y1="12" x2="9" y2="12"/></svg>
        </button>
        <button class="fmt-icon-btn" id="btnCut" title="Cortar (Ctrl+X)">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="4" cy="4" r="1.6"/><circle cx="4" cy="12" r="1.6"/><line x1="5.4" y1="5" x2="14" y2="13"/><line x1="5.4" y1="11" x2="14" y2="3"/></svg>
        </button>
        <button class="fmt-icon-btn" id="btnCopy" title="Copiar (Ctrl+C)">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2" y="4.5" width="8" height="9.5" rx="1"/><path d="M6 4.5V2.5A1 1 0 0 1 7 1.5h6A1 1 0 0 1 14 2.5v9A1 1 0 0 1 13 12.5h-1.5"/></svg>
        </button>
        <button class="fmt-icon-btn" id="btnFormatPainter" title="Copiar formato">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2 14 5 7 12l-3.5 1.5L5 10 11 2Z"/><path d="M2 14c1-2 2-3 3.5-2"/></svg>
        </button>
      </div>
      <div class="fmt-group-label">Portapapeles</div>
    </div>
    <div class="fmt-sep"></div>

    <!-- FUENTE -->
    <div class="fmt-group-wrap">
      <div class="fmt-group">
        <select class="fmt-select fmt-select-font" id="fontFamilySelect" title="Tipo de letra">
          <option value="Aptos Narrow">Aptos Narrow</option>
          <option value="Aptos">Aptos</option>
          <option value="Calibri" selected>Calibri</option>
          <option value="Arial">Arial</option>
          <option value="Georgia">Georgia</option>
          <option value="Times New Roman">Times New Roman</option>
          <option value="Courier New">Courier New</option>
          <option value="Verdana">Verdana</option>
        </select>
        <select class="fmt-select fmt-select-size" id="fontSizeSelect" title="Tamaño de letra">
          <option value="8">8</option><option value="9">9</option><option value="10">10</option>
          <option value="11" selected>11</option><option value="12">12</option><option value="14">14</option>
          <option value="16">16</option><option value="18">18</option><option value="20">20</option>
          <option value="24">24</option><option value="28">28</option><option value="36">36</option>
        </select>
        <button class="fmt-icon-btn fmt-letter" id="btnGrowFont" title="Agrandar letra">A<sup>+</sup></button>
        <button class="fmt-icon-btn fmt-letter" id="btnShrinkFont" title="Encoger letra">A<sup>-</sup></button>
      </div>
      <div class="fmt-group">
        <button class="fmt-icon-btn fmt-letter fmt-letter-bold" id="btnBold" title="Negrita (Ctrl+B)">N</button>
        <button class="fmt-icon-btn fmt-letter fmt-letter-italic" id="btnItalic" title="Cursiva (Ctrl+I)">K</button>
        <button class="fmt-icon-btn fmt-letter fmt-letter-underline" id="btnUnderline" title="Subrayado (Ctrl+U)">S</button>
        <button class="fmt-icon-btn fmt-letter fmt-letter-strike" id="btnStrike" title="Tachado">S</button>
        <div class="fmt-dropdown">
          <button class="fmt-icon-btn fmt-icon-btn-caret" id="btnBorders" title="Bordes">
            <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="1.5" y="1.5" width="13" height="13"/><line x1="1.5" y1="8" x2="14.5" y2="8"/><line x1="8" y1="1.5" x2="8" y2="14.5"/></svg>
            <span class="fmt-caret">▾</span>
          </button>
          <div class="fmt-dropdown-menu" id="borderMenu">
            <button type="button" data-border="all">▦ Todos los bordes</button>
            <button type="button" data-border="outer">▢ Bordes exteriores</button>
            <button type="button" data-border="bottom">▁ Borde inferior</button>
            <button type="button" data-border="none">✕ Sin bordes</button>
          </div>
        </div>
        <div class="fmt-dropdown fmt-split">
          <button class="fmt-icon-btn fmt-color-btn" id="btnFillColor" title="Color de relleno">
            <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M3 8 8 3l5 5-5 5-5-5Z"/></svg>
            <span class="fmt-color-bar" id="fillColorSwatch" style="background:#ffff00"></span>
          </button>
          <button class="fmt-split-caret" id="btnFillColorMenu" title="Más colores de relleno">▾</button>
          <div class="fmt-dropdown-menu fmt-palette" id="fillColorMenu" data-target="bg"></div>
        </div>
        <div class="fmt-dropdown fmt-split">
          <button class="fmt-icon-btn fmt-color-btn" id="btnFontColor" title="Color de fuente">
            <span class="fmt-color-icon">A</span>
            <span class="fmt-color-bar" id="fontColorSwatch" style="background:#c00000"></span>
          </button>
          <button class="fmt-split-caret" id="btnFontColorMenu" title="Más colores de fuente">▾</button>
          <div class="fmt-dropdown-menu fmt-palette" id="fontColorMenu" data-target="color"></div>
        </div>
      </div>
      <div class="fmt-group-label">Fuente</div>
    </div>
    <div class="fmt-sep"></div>

    <!-- ALINEACIÓN -->
    <div class="fmt-group-wrap">
      <div class="fmt-group">
        <button class="fmt-icon-btn" id="btnValignTop" title="Alinear arriba">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="1" y="1" width="14" height="14"/><line x1="4" y1="4.2" x2="12" y2="4.2" stroke-width="1.6"/><line x1="4" y1="7.2" x2="9" y2="7.2" stroke-width="1.6"/></svg>
        </button>
        <button class="fmt-icon-btn" id="btnValignMiddle" title="Alinear en el medio">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="1" y="1" width="14" height="14"/><line x1="4" y1="6.5" x2="12" y2="6.5" stroke-width="1.6"/><line x1="4" y1="9.5" x2="9" y2="9.5" stroke-width="1.6"/></svg>
        </button>
        <button class="fmt-icon-btn" id="btnValignBottom" title="Alinear abajo">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="1" y="1" width="14" height="14"/><line x1="4" y1="8.8" x2="12" y2="8.8" stroke-width="1.6"/><line x1="4" y1="11.8" x2="9" y2="11.8" stroke-width="1.6"/></svg>
        </button>
        <button class="fmt-icon-btn" id="btnAlignLeft" title="Alinear a la izquierda">
          <svg viewBox="0 0 16 16" width="15" height="15"><rect x="1" y="3" width="14" height="1.6" fill="currentColor"/><rect x="1" y="7.2" width="9" height="1.6" fill="currentColor"/><rect x="1" y="11.4" width="12" height="1.6" fill="currentColor"/></svg>
        </button>
        <button class="fmt-icon-btn" id="btnAlignCenter" title="Centrar">
          <svg viewBox="0 0 16 16" width="15" height="15"><rect x="1" y="3" width="14" height="1.6" fill="currentColor"/><rect x="3.5" y="7.2" width="9" height="1.6" fill="currentColor"/><rect x="2" y="11.4" width="12" height="1.6" fill="currentColor"/></svg>
        </button>
        <button class="fmt-icon-btn" id="btnAlignRight" title="Alinear a la derecha">
          <svg viewBox="0 0 16 16" width="15" height="15"><rect x="1" y="3" width="14" height="1.6" fill="currentColor"/><rect x="6" y="7.2" width="9" height="1.6" fill="currentColor"/><rect x="3" y="11.4" width="12" height="1.6" fill="currentColor"/></svg>
        </button>
      </div>
      <div class="fmt-group">
        <button class="fmt-icon-btn fmt-icon-btn-wide" id="btnWrapText" title="Ajustar texto">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><line x1="1" y1="3" x2="15" y2="3"/><line x1="1" y1="7" x2="10.5" y2="7"/><path d="M10.5 7h2a1.5 1.5 0 0 1 0 3H9.3"/><path d="M11 8.3 9.3 10l1.7 1.7"/><line x1="1" y1="13" x2="15" y2="13"/></svg>
          <span>Ajustar texto</span>
        </button>
        <button class="fmt-icon-btn fmt-icon-btn-wide" id="btnMergeCenter" title="Combinar y centrar">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.1"><rect x="1" y="2" width="14" height="4.5"/><rect x="1" y="9.5" width="6" height="4.5"/><rect x="9" y="9.5" width="6" height="4.5"/></svg>
          <span>Combinar y centrar</span>
        </button>
      </div>
      <div class="fmt-group-label">Alineación</div>
    </div>
    <div class="fmt-sep"></div>

    <!-- NÚMERO -->
    <div class="fmt-group-wrap">
      <div class="fmt-group">
        <div class="fmt-dropdown">
          <button class="fmt-select fmt-select-numfmt" id="btnNumFmt" title="Formato de número"><span id="numFmtLabel">General</span><span class="fmt-caret">▾</span></button>
          <div class="fmt-dropdown-menu" id="numFmtMenu">
            <button type="button" data-numfmt="general">General</button>
            <button type="button" data-numfmt="number">Número (0.00)</button>
            <button type="button" data-numfmt="currency">Moneda ($)</button>
            <button type="button" data-numfmt="percent">Porcentaje (%)</button>
          </div>
        </div>
        <button class="fmt-icon-btn fmt-letter" id="btnCurrencyFmt" title="Formato de moneda">$</button>
        <button class="fmt-icon-btn fmt-letter" id="btnPercentFmt" title="Estilo porcentual">%</button>
        <button class="fmt-icon-btn fmt-letter" id="btnCommaFmt" title="Estilo millares">000</button>
        <button class="fmt-icon-btn fmt-letter fmt-letter-small" id="btnDecimalInc" title="Aumentar decimales">.0⁺</button>
        <button class="fmt-icon-btn fmt-letter fmt-letter-small" id="btnDecimalDec" title="Disminuir decimales">.0⁻</button>
      </div>
      <div class="fmt-group-label">Número</div>
    </div>
    <div class="fmt-sep"></div>

    <button class="fmt-icon-btn fmt-icon-btn-wide" id="btnClearFormat" title="Borrar formato (mantiene el contenido)">Borrar formato</button>
    <div class="fmt-sep"></div>

    <!-- INSERTAR -->
    <div class="fmt-group-wrap">
      <div class="fmt-group">
        <button class="fmt-icon-btn fmt-icon-btn-wide" id="btnInsertPivot" title="Insertar tabla dinámica">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="1.5" y="1.5" width="13" height="13"/><line x1="1.5" y1="5.5" x2="14.5" y2="5.5"/><line x1="5.5" y1="1.5" x2="5.5" y2="14.5"/><path d="M8 8.5h4M8 11h4" stroke-width="1.4"/></svg>
          <span>Tabla dinámica</span>
        </button>
        <button class="fmt-icon-btn fmt-icon-btn-wide" id="btnRefreshPivots" title="Actualizar las tablas dinámicas de esta hoja">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M13 8a5 5 0 1 1-1.5-3.6"/><path d="M12 1.8v3h-3"/></svg>
          <span>Actualizar</span>
        </button>
      </div>
      <div class="fmt-group-label">Insertar</div>
    </div>
  </section>

  <!-- MAIN SPREADSHEET VIEWPORT -->
  <main class="spreadsheet-viewport no-print" id="spreadsheetViewport">
    <div class="sheet-canvas-wrapper" id="sheetCanvasWrapper">
      <table class="excel-grid" id="excelGrid">
        <thead id="excelGridHead"></thead>
        <tbody id="excelGridBody"></tbody>
      </table>
    </div>
  </main>

  <!-- BOTTOM SHEET TABS + STATUS BAR -->
  <footer class="excel-footer no-print">
    <div class="sheet-tabs-bar">
      <div class="tab-scroll-btns">
        <button class="tab-nav-btn" id="btnPrevSheet" title="Previous sheet">◀</button>
        <button class="tab-nav-btn" id="btnNextSheet" title="Next sheet">▶</button>
        <button class="tab-nav-btn" id="btnSheetList" title="Ver todas las hojas">☰</button>
      </div>
      <div class="sheet-tabs-list" id="sheetTabsList"></div>
      <button class="add-sheet-btn" id="btnAddSheet" title="Add new sheet (+)">＋</button>
    </div>

    <div class="excel-statusbar">
      <div class="status-left">
        <span id="statusMode">Ready</span>
        <span class="status-sep">|</span>
        <span id="statusFormulaInfo">Reunion 123 • Excel Engine Active</span>
      </div>
      <div class="status-right">
        <div class="status-metrics" id="statusMetrics">
          <span id="metricCount">Cell: Sheet1!A1</span>
          <span id="metricAvg">Average: 0</span>
          <span id="metricSum">Sum: 0</span>
        </div>
        <div class="zoom-controls">
          <button class="zoom-btn" id="btnZoomOut" title="Zoom out">−</button>
          <span id="zoomLabel">100%</span>
          <button class="zoom-btn" id="btnZoomIn" title="Zoom in">+</button>
        </div>
      </div>
    </div>
  </footer>

  <!-- TOAST NOTIFICATION -->
  <div id="toastContainer" class="toast-container no-print"></div>

  <!-- PRINTABLE ROOT FOR PDF / WINDOW.PRINT -->
  <div id="printOnlyRoot" class="print-only"></div>

  <script src="formulaEngine.js"></script>
  <script src="numberFormat.js"></script>
  <script src="app.js"></script>
  <script src="macros.js"></script>
  <script src="pivot.js"></script>
  <script src="weeks.js"></script>
  <script src="homolog.js"></script>
</body>
</html>
